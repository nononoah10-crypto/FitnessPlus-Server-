<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitnessPlus Verwaltung</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#e7f3ec;color:#153c32;margin:0;padding:16px}main{max-width:700px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin:0 0 12px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 8px #134c3811}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #bddecf;border-radius:11px;font:inherit;background:#fcfefd}input[type=checkbox]{width:auto;display:inline-block;margin-right:9px}button{background:#087e68;color:#fff;border:0;padding:12px 16px;border-radius:11px;font:inherit;font-weight:700;margin-top:10px}button:disabled{opacity:.6}#notice{position:sticky;top:0;background:#fff7d5;color:#5f4211;padding:10px;border-radius:10px;display:none}.sub{color:#637a70;font-size:13px}</style><main><h1>⚙️ FitnessPlus Verwaltung</h1><div id="notice" role="status"></div><div class="card"><h2>👥 Spieler verwalten</h2><label>Spieler auswählen</label><select id="user"><option value="">Lade Spieler …</option></select><button onclick="loadUsers()">Spieler aktualisieren</button><label>Diamanten schenken</label><input id="diamonds" type="number" value="50" min="1" max="100000"><button onclick="grantDiamonds()">Diamanten senden</button><label>Level festlegen</label><input id="level" type="number" value="10" min="1" max="10000"><button onclick="setLevel()">Level speichern</button><label>Spielstand zurücksetzen</label><p class="sub">Setzt Diamanten und Fortschritt zurück. Freundschaften bleiben erhalten.</p><button onclick="resetPlayer()">Spieler zurücksetzen</button></div><div class="card"><h2>🎉 Events & Belohnungen</h2><label><input type="checkbox" id="xp">Doppel-XP aktivieren</label><label><input type="checkbox" id="wheel">Glücksrad aktivieren</label><label><input type="checkbox" id="season">Saison-Pass aktivieren</label><label>Geschenkdiamanten für alle</label><input id="gift" type="number" min="0" max="10000" value="0"><button onclick="saveEvents()">Events speichern</button></div><div class="card"><h2>📢 Nachricht an alle</h2><label>Überschrift</label><input id="title" maxlength="80" placeholder="Wichtige Nachricht"><label>Nachricht</label><textarea id="message" rows="4" maxlength="1000"></textarea><button onclick="announce()">Nachricht veröffentlichen</button><p class="sub">Leerer Nachrichtentext entfernt die aktuelle Nachricht.</p></div></main><script>
let players=[];const $=id=>document.getElementById(id);function notice(text){$('notice').style.display='block';$('notice').textContent=text;scrollTo({top:0,behavior:'smooth'})}async function api(path,body){try{let r=await fetch('/api/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Serverfehler');return j}catch(e){notice('❌ '+e.message);throw e}}
function selected(){let id=$('user').value;if(!id){notice('Bitte Spieler auswählen');return null}return id}
async function loadUsers(){let j=await api('admin/users');players=j.users;let s=$('user'),previous=s.value;s.textContent='';for(let p of players){let option=document.createElement('option');option.value=p.id;option.textContent=`${p.name} · Level ${p.level} · 💎 ${p.diamonds}`;s.append(option)}if(players.some(p=>p.id===previous))s.value=previous}
async function grantDiamonds(){let userId=selected();if(!userId)return;let amount=Number($('diamonds').value);if(!confirm(`Wirklich ${amount} Diamanten senden?`))return;await api('admin/diamonds',{userId,amount});notice('✅ Diamanten gesendet');await loadUsers()}
async function setLevel(){let userId=selected();if(!userId)return;let level=Number($('level').value);await api('admin/level',{userId,level});notice('✅ Level gespeichert');await loadUsers()}
async function resetPlayer(){let userId=selected();if(!userId)return;let player=players.find(x=>x.id===userId);if(!player)return;let confirmName=prompt(`Achtung! Spielstand von ${player.name} wirklich zurücksetzen? Gib den Spielernamen genau ein:`);if(confirmName===null)return;await api('admin/reset-player',{userId,confirmName});notice('✅ Spielstand zurückgesetzt');await loadUsers()}
async function saveEvents(){await api('admin/events',{doubleXp:$('xp').checked,wheel:$('wheel').checked,season:$('season').checked,giftDiamonds:Number($('gift').value)});notice('✅ Events gespeichert')}
async function announce(){await api('admin/announcement',{title:$('title').value,message:$('message').value});notice('✅ Nachricht gespeichert')}
(async()=>{try{await loadUsers();let e=(await api('events')).events;$('xp').checked=!!e.doubleXp;$('wheel').checked=!!e.wheel;$('season').checked=!!e.season;$('gift').value=e.giftDiamonds||0;let a=(await api('announcements')).message;if(a){$('title').value=a.title||'';$('message').value=a.message||''}}catch{}})();
</script></html>
