<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitnessPlus · Face ID einrichten</title><style>body{font:17px system-ui;background:#eaf6f1;color:#173c33;margin:30px auto;max-width:500px;padding:15px}.card{background:white;padding:25px;border-radius:20px}button{background:#087a67;color:white;border:0;border-radius:12px;padding:15px;width:100%;font:inherit}#status{margin-top:20px}</style><div class="card"><h1>Face ID einrichten</h1><p>Dieser Link funktioniert nur mit deinem geheimen Einrichtungscode und nur solange noch kein Admin-Passkey gespeichert ist.</p><button id="go">Face ID jetzt registrieren</button><p id="status"></p></div><script>
const status=document.getElementById('status');
function bytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))}
function b64(buffer){return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function api(endpoint,data){const r=await fetch('/api/passkey/'+endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Serverfehler');return j}
document.getElementById('go').onclick=async()=>{try{const setupToken=new URLSearchParams(location.hash.slice(1)).get('token');if(!setupToken)throw Error('Im Link fehlt der geheime Einrichtungscode.');status.textContent='Face ID wird vorbereitet …';const x=await api('register/options',{setupToken});const o=x.options;const publicKey={...o,challenge:bytes(o.challenge),user:{...o.user,id:bytes(o.user.id)},excludeCredentials:o.excludeCredentials?.map(c=>({...c,id:bytes(c.id)}))};const c=await navigator.credentials.create({publicKey});const credential={id:c.id,rawId:b64(c.rawId),type:c.type,response:{clientDataJSON:b64(c.response.clientDataJSON),attestationObject:b64(c.response.attestationObject),transports:c.response.getTransports?.()||[]},clientExtensionResults:c.getClientExtensionResults(),authenticatorAttachment:c.authenticatorAttachment||undefined};await api('register/verify',{setupToken,challengeId:x.challengeId,credential});history.replaceState(null,'',location.pathname);status.textContent='Erfolgreich! Dein Passkey wurde gespeichert.';location.href='/admin-control.html'}catch(e){status.textContent='Fehler: '+e.message}};
</script></html>
