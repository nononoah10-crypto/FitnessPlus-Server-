  let taps=0, last=0;
  function openAdmin(){
    window.location.assign('/admin-control.html');
  }
  document.addEventListener('DOMContentLoaded',function(){
    const logo=document.querySelector('.top .brand .logo');
    if(!logo)return;
    logo.addEventListener('click',function(){
      const now=Date.now();
