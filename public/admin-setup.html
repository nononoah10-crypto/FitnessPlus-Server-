<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitnessPlus Admin einrichten</title><style>body{font:16px system-ui;background:#e8f4ed;color:#123e32;min-height:100vh;display:grid;place-items:center;margin:0;padding:16px;box-sizing:border-box}main{background:white;border-radius:24px;padding:24px;width:min(100%,440px);box-sizing:border-box;box-shadow:0 12px 42px #164a3d18}label{display:block;font-weight:700;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #bdd5c7;border-radius:12px;font-size:17px}button{width:100%;border:0;border-radius:12px;background:#087e68;color:white;padding:14px;margin-top:20px;font-weight:700}p{color:#587568;line-height:1.5}#error{color:#ac1f3b}</style><main><h1>🔐 FitnessPlus Admin</h1><p>Einmalige Einrichtung. Nach dem Speichern wird dieser Link dauerhaft ungültig.</p><form id="f"><label>Admin-Passwort festlegen (mindestens 10 Zeichen)</label><input id="p" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><label>Passwort wiederholen</label><input id="p2" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><button type="submit">Passwort festlegen</button></form><p id="error" role="status"></p></main><script>const f=document.querySelector('#f'),m=document.querySelector('#error'),token=location.hash.slice(1);history.replaceState(null,'',location.pathname);(async()=>{try{let r=await fetch('/api/admin-code/status');let s=await r.json();if(s.configured){f.hidden=true;m.textContent='Der Einrichtungslink wurde bereits verbraucht. Bitte öffne deine Admin-App.'}}catch{}})();f.onsubmit=async e=>{e.preventDefault();const a=document.querySelector('#p').value,b=document.querySelector('#p2').value;if(a!==b){m.textContent='Die Passwörter stimmen nicht überein.';return}if(!token){m.textContent='Kein gültiger Einrichtungslink. Bitte Link aus Render-Logs verwenden.';return}try{const r=await fetch('/api/admin-code/setup',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({token,code:a})});const j=await r.json();if(!r.ok)throw Error(j.error||'Serverfehler');f.hidden=true;m.style.color='#087e68';m.textContent='✅ Fertig! Link ist jetzt dauerhaft gesperrt. Öffne deine FitnessPlus-Admin-App und tippe 7-mal aufs Logo.'}catch(err){m.textContent=err.message}};</script></html>
